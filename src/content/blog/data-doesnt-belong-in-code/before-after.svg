<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" font-family="Inter, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#dc2626"/></marker>
    <marker id="read" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker>
  </defs>
  <rect width="760" height="416" rx="12" fill="#f8fafc"/>
  <text x="24" y="30" font-size="15" font-weight="600" fill="#0f172a">Code reads a property of the row, never the row itself</text>
  <line x1="380" y1="52" x2="380" y2="400" stroke="#e2e8f0"/>
  <text x="24" y="66" font-weight="600" fill="#0f172a">Before: code names a row</text>
  <text x="404" y="66" font-weight="600" fill="#0f172a">After: code reads a flag on the row</text>

  <!-- before table -->
  <text x="24" y="88" font-size="11.5" fill="#475569">Categories table</text>
  <g fill="none" stroke="#64748b" stroke-width="1.25">
    <rect x="24" y="98" width="332" height="104" rx="6"/>
    <line x1="24" y1="124" x2="356" y2="124"/>
    <line x1="24" y1="150" x2="356" y2="150" stroke="#e2e8f0"/>
    <line x1="24" y1="176" x2="356" y2="176" stroke="#e2e8f0"/>
  </g>
  <text x="40" y="116" font-size="11.5" font-weight="600" fill="#475569">name</text>
  <text x="40" y="142" font-weight="600" fill="#dc2626">Electronics</text>
  <text x="40" y="168" fill="#0f172a">Books</text>
  <text x="40" y="194" fill="#0f172a">Toys</text>

  <g fill="none" stroke="#dc2626" stroke-width="1.25" stroke-dasharray="4 4">
    <path d="M36 202V342"/>
    <path d="M36 246H46" marker-end="url(#bad)"/>
    <path d="M36 294H46" marker-end="url(#bad)"/>
    <path d="M36 342H46" marker-end="url(#bad)"/>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="1.25">
    <rect x="48" y="226" width="308" height="40" rx="8"/>
    <rect x="48" y="274" width="308" height="40" rx="8"/>
    <rect x="48" y="322" width="308" height="40" rx="8"/>
  </g>
  <text x="64" y="250" font-weight="600" fill="#0f172a">Checkout</text>
  <text x="340" y="250" text-anchor="end" font-size="11.5" font-family="ui-monospace, monospace" fill="#dc2626">category === 'Electronics'</text>
  <text x="64" y="298" font-weight="600" fill="#0f172a">Email</text>
  <text x="340" y="298" text-anchor="end" font-size="11.5" font-family="ui-monospace, monospace" fill="#dc2626">if name == 'Electronics'</text>
  <text x="64" y="346" font-weight="600" fill="#0f172a">Report</text>
  <text x="340" y="346" text-anchor="end" font-size="11.5" font-family="ui-monospace, monospace" fill="#dc2626">WHERE name = 'Electronics'</text>
  <text x="24" y="392" font-size="11.5" fill="#475569">Rename the row and three places break silently</text>

  <!-- after table -->
  <text x="404" y="88" font-size="11.5" fill="#475569">Categories table</text>
  <rect x="570" y="98" width="166" height="104" fill="#6366f1" fill-opacity="0.12"/>
  <g fill="none" stroke="#64748b" stroke-width="1.25">
    <rect x="404" y="98" width="332" height="104" rx="6"/>
    <line x1="404" y1="124" x2="736" y2="124"/>
    <line x1="404" y1="150" x2="736" y2="150" stroke="#e2e8f0"/>
    <line x1="404" y1="176" x2="736" y2="176" stroke="#e2e8f0"/>
    <line x1="570" y1="98" x2="570" y2="202" stroke="#e2e8f0"/>
  </g>
  <text x="420" y="116" font-size="11.5" font-weight="600" fill="#475569">name</text>
  <text x="586" y="116" font-size="11.5" font-weight="600" fill="#0f172a">offers_warranty</text>
  <text x="420" y="142" fill="#0f172a">Electronics</text>
  <text x="586" y="142" font-family="ui-monospace, monospace" fill="#0f172a">true</text>
  <text x="420" y="168" fill="#0f172a">Books</text>
  <text x="586" y="168" font-family="ui-monospace, monospace" fill="#0f172a">false</text>
  <text x="420" y="194" fill="#0f172a">Toys</text>
  <text x="586" y="194" font-family="ui-monospace, monospace" fill="#0f172a">false</text>

  <g fill="none" stroke="#64748b" stroke-width="1.25">
    <path d="M416 202V342"/>
    <path d="M416 246H426" marker-end="url(#read)"/>
    <path d="M416 294H426" marker-end="url(#read)"/>
    <path d="M416 342H426" marker-end="url(#read)"/>
    <rect x="428" y="226" width="308" height="40" rx="8"/>
    <rect x="428" y="274" width="308" height="40" rx="8"/>
    <rect x="428" y="322" width="308" height="40" rx="8"/>
  </g>
  <text x="444" y="250" font-weight="600" fill="#0f172a">Checkout</text>
  <text x="720" y="250" text-anchor="end" font-size="11.5" font-family="ui-monospace, monospace" fill="#0f172a">category.offers_warranty</text>
  <text x="444" y="298" font-weight="600" fill="#0f172a">Email</text>
  <text x="720" y="298" text-anchor="end" font-size="11.5" font-family="ui-monospace, monospace" fill="#0f172a">if offers_warranty</text>
  <text x="444" y="346" font-weight="600" fill="#0f172a">Report</text>
  <text x="720" y="346" text-anchor="end" font-size="11.5" font-family="ui-monospace, monospace" fill="#0f172a">WHERE offers_warranty</text>
  <text x="404" y="392" font-size="11.5" fill="#475569">Rows change freely; no code names one</text>
</svg>
