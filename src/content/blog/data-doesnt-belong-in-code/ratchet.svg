<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="Inter, system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker>
  </defs>
  <rect width="760" height="300" rx="12" fill="#f8fafc"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#0f172a">A new literal fails the gate and becomes a row</text>

  <g fill="none" stroke="#64748b" stroke-width="1.25">
    <path d="M174 110H216" marker-end="url(#a)"/>
    <path d="M366 110H412" marker-end="url(#a)"/>
    <path d="M540 110H586" marker-end="url(#a)"/>
    <path d="M476 150V212" marker-end="url(#a)"/>
    <path d="M401 240H366" marker-end="url(#a)"/>
    <path d="M216 240H174" marker-end="url(#a)"/>
    <path d="M99 212V138" marker-end="url(#a)"/>
    <rect x="24" y="82" width="150" height="56" rx="8"/>
    <rect x="216" y="82" width="150" height="56" rx="8"/>
    <rect x="586" y="82" width="150" height="56" rx="8"/>
    <rect x="401" y="212" width="150" height="56" rx="8"/>
    <rect x="216" y="212" width="150" height="56" rx="8"/>
    <polygon points="412,110 476,70 540,110 476,150"/>
  </g>
  <rect x="24" y="212" width="150" height="56" rx="8" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-width="2"/>

  <g text-anchor="middle">
    <text x="99" y="106" font-weight="600" fill="#0f172a">Agent writes code</text>
    <text x="99" y="124" font-size="11.5" fill="#475569">from context patterns</text>
    <text x="291" y="106" font-weight="600" fill="#0f172a">Lint vs baseline</text>
    <text x="291" y="124" font-size="11.5" fill="#475569">frozen literal list</text>
    <text x="476" y="114" fill="#0f172a">New literal?</text>
    <text x="661" y="106" font-weight="600" fill="#0f172a">Commit</text>
    <text x="661" y="124" font-size="11.5" fill="#475569">baseline only shrinks</text>
    <text x="476" y="236" font-weight="600" fill="#0f172a">Check fails</text>
    <text x="476" y="254" font-size="11.5" fill="#475569">pre-commit gate</text>
    <text x="291" y="236" font-weight="600" fill="#0f172a">Propose a field</text>
    <text x="291" y="254" font-size="11.5" fill="#475569">never a constant</text>
    <text x="99" y="236" font-weight="600" fill="#0f172a">Owner approves</text>
    <text x="99" y="254" font-size="11.5" fill="#0f172a">value becomes a row</text>
    <text x="563" y="102" font-size="11.5" fill="#475569">no</text>
  </g>
  <text x="486" y="174" font-size="11.5" fill="#475569">yes</text>
  <text x="109" y="179" font-size="11.5" fill="#475569">code reads the row</text>
