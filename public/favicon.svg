<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <style>
    .bg { fill: #ffffff; }
    .mark { fill: #000000; }
    .frame { stroke: #000000; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: none; }
      .mark { fill: #ffffff; }
      .frame { stroke: #ffffff; }
    }
  </style>

  <rect class="bg" width="300" height="300" rx="120" ry="120"/>

  <!-- Hexagon shape - outline -->
  <polygon class="frame" points="150,25 260,88 260,212 150,275 40,212 40,88"
           fill="none"
           stroke-width="14"
           stroke-linejoin="miter"/>

  <!-- Letter T - crossbar is a detached text cursor -->
  <rect class="mark" x="90" y="92" width="120" height="30"/>
  <rect class="mark" x="135" y="134" width="30" height="80"/>
</svg>
