<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker>
  </defs>
  <rect width="760" height="380" rx="12" fill="#f8fafc"/>

  <!-- requests -->
  <g font-size="13" font-family="ui-monospace, monospace" fill="#1e1b4b">
    <rect x="30" y="40" width="190" height="36" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="125" y="63" text-anchor="middle">acme.example.com</text>
    <rect x="30" y="90" width="190" height="36" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="125" y="113" text-anchor="middle">globex.example.com</text>
    <rect x="30" y="140" width="190" height="36" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
    <text x="125" y="163" text-anchor="middle">custom-domain.com</text>
  </g>

  <path d="M228 108 H282" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- resolver -->
  <rect x="290" y="62" width="180" height="92" rx="10" fill="#334155"/>
  <text x="380" y="96" font-size="15" font-weight="600" text-anchor="middle" fill="#f8fafc">Tenant resolver</text>
  <text x="380" y="118" font-size="12" text-anchor="middle" fill="#cbd5e1">Host header → app</text>
  <text x="380" y="136" font-size="12" text-anchor="middle" fill="#cbd5e1">binds DB per request</text>

  <!-- control plane -->
  <path d="M380 62 V30 H560" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <rect x="566" y="12" width="170" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="651" y="37" font-size="13" text-anchor="middle" fill="#78350f">Control plane DB</text>
  <text x="470" y="24" font-size="11" text-anchor="middle" fill="#64748b">registry lookup</text>

  <!-- app dbs -->
  <path d="M330 154 V214" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <path d="M430 154 L560 214" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <g>
    <rect x="200" y="220" width="250" height="132" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="216" y="244" font-size="14" font-weight="600" fill="#14532d">app_acme database</text>
    <g font-size="12" font-family="ui-monospace, monospace" fill="#334155">
      <rect x="216" y="256" width="218" height="24" rx="5" fill="#f1f5f9"/><text x="226" y="273">metadata schema</text>
      <rect x="216" y="286" width="218" height="24" rx="5" fill="#dcfce7"/><text x="226" y="303">workspace: sales</text>
      <rect x="216" y="316" width="218" height="24" rx="5" fill="#dcfce7"/><text x="226" y="333">workspace: hr</text>
    </g>
  </g>
  <g>
    <rect x="480" y="220" width="250" height="132" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
    <text x="496" y="244" font-size="14" font-weight="600" fill="#14532d">app_globex database</text>
    <g font-size="12" font-family="ui-monospace, monospace" fill="#334155">
      <rect x="496" y="256" width="218" height="24" rx="5" fill="#f1f5f9"/><text x="506" y="273">metadata schema</text>
      <rect x="496" y="286" width="218" height="24" rx="5" fill="#dcfce7"/><text x="506" y="303">workspace: main</text>
    </g>
  </g>

  <text x="30" y="250" font-size="13" fill="#475569">Database =</text>
  <text x="30" y="268" font-size="13" fill="#475569">trust boundary</text>
  <text x="30" y="300" font-size="13" fill="#475569">Schema =</text>
  <text x="30" y="318" font-size="13" fill="#475569">scope inside it</text>
</svg>
