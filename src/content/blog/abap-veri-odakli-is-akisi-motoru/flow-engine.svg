<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker>
  </defs>
  <rect width="760" height="330" rx="12" fill="#f8fafc"/>

  <!-- input key -->
  <text x="40" y="44" font-size="13" font-weight="600" fill="#475569">LOOKUP KEY</text>
  <rect x="40" y="58" width="170" height="40" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="125" y="83" font-size="14" text-anchor="middle" fill="#1e1b4b">Current step</text>
  <rect x="40" y="108" width="170" height="40" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="125" y="133" font-size="14" text-anchor="middle" fill="#1e1b4b">Action</text>
  <rect x="40" y="158" width="170" height="40" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="125" y="183" font-size="14" text-anchor="middle" fill="#1e1b4b">Decision</text>
  <rect x="40" y="208" width="170" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="125" y="233" font-size="14" text-anchor="middle" fill="#334155">Variant (region, type…)</text>

  <path d="M218 153 H282" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- flow table -->
  <text x="290" y="44" font-size="13" font-weight="600" fill="#475569">FLOW TABLE</text>
  <rect x="290" y="58" width="200" height="190" rx="8" fill="#ffffff" stroke="#334155"/>
  <rect x="290" y="58" width="200" height="34" rx="8" fill="#334155"/>
  <text x="390" y="80" font-size="13" text-anchor="middle" fill="#f8fafc">one row = one rule</text>
  <g font-size="12" fill="#475569" font-family="ui-monospace, monospace">
    <text x="306" y="116">draft · submit · ok</text>
    <line x1="300" x2="480" y1="126" y2="126" stroke="#e2e8f0"/>
    <text x="306" y="146">draft · submit · reject</text>
    <line x1="300" x2="480" y1="156" y2="156" stroke="#e2e8f0"/>
    <rect x="296" y="164" width="188" height="28" rx="4" fill="#dcfce7"/>
    <text x="306" y="183" fill="#14532d">approve · decide · ok</text>
    <line x1="300" x2="480" y1="200" y2="200" stroke="#e2e8f0"/>
    <text x="306" y="222">approve · decide · back</text>
  </g>

  <path d="M498 153 H562" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- result -->
  <text x="570" y="44" font-size="13" font-weight="600" fill="#475569">ROW SAYS</text>
  <rect x="570" y="58" width="150" height="40" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="645" y="83" font-size="14" text-anchor="middle" fill="#14532d">Next step</text>
  <rect x="570" y="108" width="150" height="40" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="645" y="133" font-size="14" text-anchor="middle" fill="#14532d">Status</text>
  <rect x="570" y="158" width="150" height="40" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="645" y="183" font-size="14" text-anchor="middle" fill="#14532d">Who is responsible</text>
  <rect x="570" y="208" width="150" height="40" rx="8" fill="#fef3c7" stroke="#d97706"/>
  <text x="645" y="233" font-size="14" text-anchor="middle" fill="#78350f">Step history</text>

  <text x="380" y="296" font-size="14" text-anchor="middle" fill="#475569">New behaviour = new rows. The engine code stays the same.</text>
</svg>
