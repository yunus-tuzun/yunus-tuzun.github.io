<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <style>
    .cursor { animation: blink 1.2s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>

  <!-- Hexagon shape - white outline -->
  <polygon points="150,25 260,88 260,212 150,275 40,212 40,88"
           fill="none"
           stroke="#ffffff"
           stroke-width="14"
           stroke-linejoin="miter"/>

  <!-- Letter T - crossbar is a detached, blinking text cursor -->
  <rect class="cursor" x="90" y="92" width="120" height="30" fill="#ffffff"/>
  <rect x="135" y="134" width="30" height="80" fill="#ffffff"/>
</svg>
