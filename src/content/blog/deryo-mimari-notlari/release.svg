<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="Inter, system-ui, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker>
  </defs>
  <rect width="760" height="250" rx="12" fill="#f8fafc"/>

  <rect x="30" y="95" width="160" height="60" rx="10" fill="#334155"/>
  <text x="110" y="122" font-size="15" font-weight="600" text-anchor="middle" fill="#f8fafc">Local disk</text>
  <text x="110" y="141" font-size="12" text-anchor="middle" fill="#cbd5e1">work in progress</text>

  <!-- dev path -->
  <path d="M190 112 C 260 112, 260 60, 330 60" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <text x="262" y="66" font-size="12" text-anchor="middle" fill="#64748b">file sync</text>
  <rect x="336" y="32" width="180" height="56" rx="10" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="426" y="57" font-size="14" font-weight="600" text-anchor="middle" fill="#1e1b4b">Dev runtime</text>
  <text x="426" y="75" font-size="12" text-anchor="middle" fill="#3730a3">*.dev hosts · own registry</text>

  <!-- prod path -->
  <path d="M190 138 C 260 138, 260 190, 330 190" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <text x="262" y="200" font-size="12" text-anchor="middle" fill="#64748b">git push</text>
  <rect x="336" y="162" width="150" height="56" rx="10" fill="#ffffff" stroke="#334155"/>
  <text x="411" y="187" font-size="14" font-weight="600" text-anchor="middle" fill="#0f172a">GitHub</text>
  <text x="411" y="205" font-size="12" text-anchor="middle" fill="#475569">tag v2026.08.4</text>

  <path d="M486 190 H560" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <text x="523" y="181" font-size="12" text-anchor="middle" fill="#64748b">checkout tag</text>
  <rect x="566" y="162" width="170" height="56" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="651" y="187" font-size="14" font-weight="600" text-anchor="middle" fill="#14532d">Prod runtime</text>
  <text x="651" y="205" font-size="12" text-anchor="middle" fill="#166534">one version, all apps</text>

  <!-- forbidden -->
  <path d="M516 70 C 640 70, 660 110, 651 156" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="640" y="104" font-size="20" font-weight="700" fill="#dc2626">✕</text>
  <text x="660" y="104" font-size="12" fill="#dc2626">never</text>
</svg>
